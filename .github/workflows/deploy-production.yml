name: Production CI/CD

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

env:
  OWNER: ${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     pragna
          POSTGRES_PASSWORD: pragna_dev
          POSTGRES_DB:       pragna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pragna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load test environment
        run: grep -v '^#' .env.test | grep -v '^$' >> $GITHUB_ENV

      - name: Run unit + e2e tests
        run: pytest tests/unit/ tests/e2e/ -v -s --tb=long -m "not live" --log-cli-level=INFO

  # ── Version & build ────────────────────────────────────────────────────────
  build:
    name: Build production image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          current=$(cat VERSION | tr -d '[:space:]')

          # On workflow_dispatch, apply the requested bump
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            major=$(echo $current | cut -d. -f1)
            minor=$(echo $current | cut -d. -f2)
            patch=$(echo $current | cut -d. -f3)
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new="$major.$minor.$patch"
            echo "$new" > VERSION
          else
            # Push to main: version is whatever was set in the release PR
            new="$current"
          fi

          echo "value=$new" >> $GITHUB_OUTPUT
          echo "Version: $new"

      - name: Generate release notes
        run: |
          version="${{ steps.version.outputs.value }}"
          date=$(date -u +"%Y-%m-%d")
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$last_tag" ]; then
            commits=$(git log --no-merges --format="%s" -100)
          else
            commits=$(git log --no-merges --format="%s" "${last_tag}..HEAD")
          fi

          features=$(echo "$commits" | grep -E "^feat:"         | sed 's/^feat: /- /'     || true)
          fixes=$(echo "$commits"    | grep -E "^(fix|hotfix):" | sed 's/^\(fix\|hotfix\): /- /' || true)
          docs=$(echo "$commits"     | grep -E "^docs:"         | sed 's/^docs: /- /'     || true)
          refactor=$(echo "$commits" | grep -E "^refactor:"     | sed 's/^refactor: /- /' || true)

          mkdir -p release-notes
          {
            echo "# v${version} — ${date}"
            echo ""
            if [ -n "$features" ];  then echo "## Features";      echo "$features";  echo ""; fi
            if [ -n "$fixes" ];     then echo "## Bug Fixes";     echo "$fixes";     echo ""; fi
            if [ -n "$refactor" ];  then echo "## Refactoring";   echo "$refactor";  echo ""; fi
            if [ -n "$docs" ];      then echo "## Documentation"; echo "$docs";      echo ""; fi
            if [ -z "$features" ] && [ -z "$fixes" ] && [ -z "$refactor" ] && [ -z "$docs" ]; then
              echo "No notable changes."; echo ""
            fi
          } > "release-notes/v${version}.md"

          cat "release-notes/v${version}.md"
          echo "### Release notes: v${version}" >> $GITHUB_STEP_SUMMARY
          cat "release-notes/v${version}.md"   >> $GITHUB_STEP_SUMMARY

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit VERSION bump (only when workflow_dispatch bumped it)
          if git diff --quiet VERSION; then
            echo "VERSION unchanged — no commit needed"
          else
            git add VERSION
            git commit -m "chore: bump version to ${{ steps.version.outputs.value }} [skip ci]"
            git push
          fi
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ env.OWNER }}/pragna-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ env.OWNER }}/pragna-api:latest

  # ── Blue-green deploy ──────────────────────────────────────────────────────
  deploy:
    name: Blue-green deploy to production
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy via blue-green script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.VPS_API_REPO_PATH }}
            git pull
            chmod +x scripts/blue-green-api.sh
            scripts/blue-green-api.sh \
              "${{ needs.build.outputs.version }}" \
              "${{ github.repository_owner }}"

      - name: Summary
        if: always()
        run: |
          echo "### Production deploy: v${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
