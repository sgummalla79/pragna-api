apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pragna-api
  namespace: pragna-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: pragna-api-stripprefix-pragna@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: api.sgummallaworks.com
      http:
        paths:
          - path: /pragna
            pathType: Prefix
            backend:
              service:
                name: pragna-api
                port:
                  number: 8000
  tls:
    - hosts:
        - api.sgummallaworks.com
      secretName: pragna-api-tls
